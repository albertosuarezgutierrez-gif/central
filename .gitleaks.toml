# Config de gitleaks para el monorepo central.
# Objetivo: que NUNCA se vuelva a colar un secreto en el código (como la API key
# de Smoobu hardcodeada que vivía en apps/sivra antes de #219).
[extend]
useDefault = true

[allowlist]
description = "Falsos positivos y secretos ya filtrados EN PROCESO DE ROTACIÓN (no bloquear el historial por ellos)"
paths = [
  '''.*\.next/.*''',          # artefactos de build (gitignored, por si acaso)
  '''pnpm-lock\.yaml''',
  '''.*package-lock\.json''',
  # Falso positivo: enablebanking.ts construye la cabecera "-----BEGIN PRIVATE KEY-----"
  # alrededor de una variable de runtime (la clave real viene de env); no hay material de clave.
  '''apps/plataforma/lib/enablebanking\.ts''',
  # Mismo falso positivo: la Edge Function rescatada `drive-upload-factura` hace
  # `sa.private_key.replace(/-----BEGIN PRIVATE KEY-----|…/g, '')` para quitar la cabecera PEM
  # de una clave que viene de env. Es la cabecera literal dentro de un regex, no material de clave.
  '''supabase/functions-rescatadas/drive-upload-factura/index\.ts''',
]
regexes = [
  # Smoobu key filtrada en el historial pre-#219. El código actual la lee de
  # pms_connections (BD); pendiente de revocar en Smoobu. Allowlisted para que el
  # escaneo no falle por el historial — NO volver a usarla.
  '''vqOXOSDtA7p80Fp~\.ezOXPn_zPYq99gC''',
  # Fixture de test de cripto Tuya (NO es un secreto real): clave AES-256 de 32 chars
  # que vivió en tuya-cifrado.test.ts (commit del PR de domótica). El código actual la
  # construye por repetición; se allowlista el literal por el historial del PR.
  '''0123456789abcdef0123456789abcdef''',
  # Fixture de test del índice ciego PII (packages/module-seguros-pii/src/blind-index.test.ts,
  # portado verbatim del repo asegura): FAKE_KEY_B, 64 hex sintéticos por repetición del patrón
  # inverso al de arriba. NO es un secreto real; se allowlista el literal por el historial.
  '''fedcba9876543210fedcba9876543210''',
  # Anon key PÚBLICA del proyecto Supabase compartido (wswbehlcuxqxyinousql), hardcodeada
  # en el bridge de impresión (scripts/bridge-v6) igual que lo estaba la del proyecto viejo:
  # es una clave de cliente (viaja en todo bundle del navegador), la protección real es RLS.
  # NO es un secreto de auth — esos siguen prohibidos por el guardián.
  '''pskPJ1U-i0Vjg_suxMfXNqHOtKJpWchf0-CzLUQIzRo''',
]

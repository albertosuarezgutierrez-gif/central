name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  # Disparo a mano: los pushes hechos con token de App NO disparan workflows, así que un PR
  # de un agente se queda con los checks requeridos en «Expected». OJO: lanzarlo a mano sirve
  # para VERIFICAR que el código está sano, pero NO desbloquea el merge — el ruleset no cuenta
  # los check runs de workflow_dispatch (comprobado 26/08/2026 con los 12 en verde sobre dos
  # heads). Eso lo desbloquea solo un push de una persona. Ver CLAUDE.md § «CI: por qué un PR
  # de Claude se queda con los checks Expected».
  workflow_dispatch:

# Cancelar runs anteriores del mismo branch si llega uno nuevo
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · TypeCheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Casa de marcas: ia-rest es una vertical en apps/ia-rest (la raíz es la matriz).
    defaults:
      run:
        working-directory: apps/ia-rest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # HEAD = merge del PR, HEAD^1 = su base

      # 💸 Solo en PRs: si el PR no toca ia-rest ni un package que consuma, se saltan
      # install/lint/tsc/build y el job (check REQUERIDO) termina en verde. Push a
      # main y dispatch: siempre entero. Reglas (fail-open) en scripts/ci-app-afectada.mjs.
      - name: ¿El PR toca ia-rest?
        id: afecta
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # La regla se ejecuta desde la BASE, no desde el PR: así un PR no puede
            # saltarse sus propios checks editando el script (Graphify, #3297).
            if git show HEAD^1:scripts/ci-app-afectada.mjs > "$RUNNER_TEMP/afectada.mjs" 2>/dev/null; then
              node "$RUNNER_TEMP/afectada.mjs" apps/ia-rest HEAD^1
            else
              echo "afecta=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "afecta=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.afecta.outputs.afecta != 'false'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.afecta.outputs.afecta != 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: steps.afecta.outputs.afecta != 'false'
        run: pnpm install --no-frozen-lockfile

      # ── 1. ESLint ──────────────────────────────────────────────────────────
      - name: Lint
        if: steps.afecta.outputs.afecta != 'false'
        run: pnpm run lint

      # ── 2. TypeScript ──────────────────────────────────────────────────────
      - name: TypeScript check
        if: steps.afecta.outputs.afecta != 'false'
        run: pnpm exec tsc --noEmit

      # ── 3. Build ───────────────────────────────────────────────────────────
      # Usamos vars dummy para que next build no falle por falta de env.
      # El objetivo es verificar que el código compila, no que funciona en runtime.
      - name: Build
        if: steps.afecta.outputs.afecta != 'false'
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://wswbehlcuxqxyinousql.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci_dummy_key_build_check_only
          SUPABASE_SERVICE_ROLE_KEY: ci_dummy_service_role_key
          NEXTAUTH_SECRET: ci_dummy_secret
          NEXTAUTH_URL: https://www.iarest.es
        run: pnpm run build

  # ── Aviso en PR hacia main ──────────────────────────────────────────────────
  # Si el CI pasa, es seguro hacer merge dev→main
  ready-to-merge:
    name: Ready to merge
    needs: check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: CI passed ✓
        run: echo "Lint + TypeCheck + Build OK — safe to merge to main"

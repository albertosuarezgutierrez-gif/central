name: gitleaks

# Escaneo de secretos: bloquea PRs/push que INTRODUZCAN una credencial nueva
# (la lección del incidente de la API key de Smoobu, jun-2026). Escanea sólo los
# commits nuevos del PR/push, no el árbol entero, para no fallar por deuda histórica
# (que se aborda por separado) y centrarse en evitar fugas NUEVAS.
on:
  pull_request:
  push:
    branches: [main]
  # Disparo a mano: los pushes hechos con token de App NO disparan workflows, así que un
  # PR que recibe más de un commit se queda con los checks del PRIMERO y aspecto de estar bien.
  # Sin esto, este check no se puede relanzar sobre el head actual (20/08/2026).
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (solo commits nuevos)
        run: |
          VER=8.21.2
          # --retry: la descarga NO tenía reintento y un 503 de GitHub Releases pintaba el PR
          # en rojo sin haber escaneado una sola línea (12/08/2026, PR #1394). Falla cerrado a
          # propósito —un escáner de secretos que no arranca debe ponerse rojo, nunca verde—,
          # pero un rojo que no significa nada acaba mirándose por encima, y ese es justo el
          # check que no puede acostumbrar a nadie a ignorarlo. --retry-all-errors reintenta
          # también los 5xx (sin él, curl solo reintenta errores de conexión y timeouts).
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" | tar -xz gitleaks
          # El runner corre `bash -e` SIN `pipefail`, así que el código de salida de
          # `curl | tar` es el de TAR, no el de curl. Esta vez se vio el fallo solo porque tar
          # también reventó al recibir un .gz truncado; una descarga que devolviera algo
          # desempaquetable pero inservible pasaría de largo. Se comprueba el binario y punto.
          test -x ./gitleaks || { echo "::error::no se pudo descargar gitleaks v${VER}"; exit 1; }
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE" ]; then
              RANGE="-1 ${{ github.sha }}"
            else
              RANGE="${BEFORE}..${{ github.sha }}"
            fi
          fi
          echo "Rango escaneado: $RANGE"
          ./gitleaks detect --source=. --log-opts="$RANGE" -c .gitleaks.toml --redact --exit-code 1

name: gitleaks

# Escaneo de secretos: bloquea PRs/push que INTRODUZCAN una credencial nueva
# (la lección del incidente de la API key de Smoobu, jun-2026). Escanea sólo los
# commits nuevos del PR/push, no el árbol entero, para no fallar por deuda histórica
# (que se aborda por separado) y centrarse en evitar fugas NUEVAS.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (solo commits nuevos)
        run: |
          VER=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" | tar -xz gitleaks
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE" ]; then
              RANGE="-1 ${{ github.sha }}"
            else
              RANGE="${BEFORE}..${{ github.sha }}"
            fi
          fi
          echo "Rango escaneado: $RANGE"
          ./gitleaks detect --source=. --log-opts="$RANGE" -c .gitleaks.toml --redact --exit-code 1

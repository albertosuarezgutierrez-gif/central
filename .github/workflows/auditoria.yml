name: Auditoría de estructura

# Mantiene la radiografía del repo (apps/plataforma/lib/estructura.generated.json)
# SIEMPRE al día, sola: en cada push a main que toque la estructura, regenera el JSON y,
# si cambió, lo deja en un PR. El script es Node puro (no instala dependencias).
#
# Desde el 19/08/2026 NO commitea contra `main` (el ruleset «main - CI obligatorio» solo
# admite el merge de un PR verde): abre/actualiza el PR `claude/auditoria-radiografia` y
# lo mergea `rutinas-automerge.yml`. Sin bucles: el JSON conserva su timestamp si el
# contenido real no cambió, así que un push que no toca la estructura no genera commit.

on:
  push:
    # Solo main: en ramas de feature no se commitea la radiografía (ver más abajo),
    # así que ejecutarlo ahí solo gastaría minutos de Actions sin efecto. Al mergear
    # a main se regenera igual. Antes era ['**'] y cada push a cualquier rama generaba
    # un commit-bot que reconstruía todos los proyectos Vercel (coste de build).
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.claude/skills/**'
      - 'docs/CONTEXTO-SESIONES.md'
      - 'scripts/auditar-estructura.mjs'
      - '.github/workflows/auditoria.yml'
  # A mano. Hace falta de verdad, no es un adorno: un push a `main` hecho con el token de una
  # GitHub App (p. ej. el merge de un PR desde una sesión de Claude Code) NO dispara workflows,
  # así que hay merges tras los cuales la radiografía sencillamente no se regenera y nadie se
  # entera. Comprobado el 19/08/2026: el merge de #1501 (a6ef85ab) no disparó NI UN workflow.
  # `workflow_dispatch` sí se puede lanzar desde la API con ese mismo token, así que es la vía
  # para forzar una pasada y para probar este workflow sin esperar al siguiente push humano.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # `true` porque este job REGENERA un estado entero, no acumula: de dos pasadas solapadas solo la
  # última significa algo. (Se puso el 19/08/2026 culpando a una carrera de dos pasadas del PR sin
  # checks; ESO ERA FALSO —ver más abajo, el problema es el force-push, no la carrera—. La opción
  # se queda igualmente porque regenerar dos veces a la vez no aporta nada.)
  group: auditoria-${{ github.ref }}
  cancel-in-progress: true

jobs:
  radiografia:
    name: Radiografía al día
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerar radiografía
        run: node scripts/auditar-estructura.mjs

      # SOLO en main: la radiografía se commitea de vuelta únicamente en la rama principal.
      # En ramas de feature ese commit-bot generaba un push extra que reconstruía TODOS los
      # proyectos Vercel del monorepo (amplificaba la factura de Build CPU Minutes). Además,
      # el propio `ignoreCommand` (scripts/vercel-ignore-build.mjs) ya salta en Vercel los
      # commits con [skip ci]; esta guarda evita incluso generarlos fuera de main.
      # La radiografía aterriza por PR, NO por push a `main`. Desde el 19/08/2026 `main` está
      # protegido por el ruleset «main - CI obligatorio» y solo acepta el merge de un PR con los
      # checks required en verde; `github-actions[bot]` no se puede poner en la lista de omisión
      # del ruleset, así que un push directo desde aquí se rechaza. El PR lo mergea solo
      # `rutinas-automerge.yml` (estos tres ficheros están en su lista de registro).
      #
      # ⚠️ El mensaje lleva `[skip vercel]` y NO `[skip ci]`, a propósito: `[skip ci]` lo honra
      # GitHub Actions y dejaría el PR SIN checks — y el automerge, con razón, no mergea un PR sin
      # checks. `[skip vercel]` no lo entiende Actions pero sí `scripts/vercel-ignore-build.mjs`,
      # así que la CI corre y los builds de Vercel siguen sin dispararse.
      #
      # 🔑 El push y el `gh pr create` van con GH_PAT_TRIGGER, NO con GITHUB_TOKEN. Ni los pushes
      # ni los PRs abiertos con el GITHUB_TOKEN del propio run disparan workflows, así que el PR
      # nacería con CERO checks — y un PR sin checks no lo mergea `rutinas-automerge.yml` (con
      # razón: «no hay checks» ≠ «los checks pasaron»). Se quedaría abierto para siempre. Es la
      # misma trampa documentada en la cabecera de `ai-programar.yml`. Sin el secret NO abrimos
      # el PR: dejamos la rama pusheada y avisamos, que es mejor que un PR zombi.
      - name: Abrir/actualizar el PR de la radiografía
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TRIGGER }}
          PAT: ${{ secrets.GH_PAT_TRIGGER }}
          REPO: ${{ github.repository }}
          RAMA: claude/auditoria-radiografia
        run: |
          set -euo pipefail
          FILES="apps/plataforma/lib/estructura.generated.json docs/ARQUITECTURA.generated.md docs/mapa-funciones.generated.json"
          if [ -z "$(git status --porcelain $FILES)" ]; then
            echo "Radiografía ya al día — sin cambios."
            exit 0
          fi
          if [ -z "$PAT" ]; then
            echo "::error::Falta el secret GH_PAT_TRIGGER — sin él el PR de la radiografía nacería sin checks y nunca se mergearía. La radiografía queda SIN actualizar en main hasta que se configure."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # La rama se rehace desde el `main` de esta pasada: la radiografía se regenera entera
          # cada vez, así que arrastrar la rama anterior solo daría conflictos.
          git checkout -q -B "$RAMA"
          git add $FILES
          git commit -q -m 'chore(auditoría): regenerar radiografía de estructura [skip vercel]'

          # Se CIERRA el PR anterior y su rama antes de abrir el nuevo, en vez de reutilizarlos.
          # Medido el 19/08/2026, dos veces seguidas: un force-push desde dentro de Actions a una
          # rama que YA tiene un PR abierto no dispara los workflows `pull_request` (ni con el PAT
          # en la URL) → el PR se queda sobre un sha con UN check cosmético, sin los required, y
          # ya no hay forma de mergearlo. En cambio CREAR la rama y ABRIR el PR sí los dispara
          # (14 checks, comprobado). Así que cada pasada estrena rama: el PR nace siempre por
          # `opened`, que es el camino que funciona.
          RAMA_RUN="${RAMA}-${{ github.run_id }}"
          for viejo in $(gh pr list --state open --json number,headRefName \
                          --jq ".[] | select(.headRefName | startswith(\"$RAMA\")) | .number"); do
            gh pr close "$viejo" --comment 'Reemplazado por una radiografía más fresca (cada pasada estrena rama; ver `.github/workflows/auditoria.yml`).' --delete-branch || true
            echo "PR de radiografía anterior #$viejo cerrado."
          done

          git push -q "https://x-access-token:${PAT}@github.com/${REPO}.git" "HEAD:refs/heads/$RAMA_RUN"
          gh pr create --head "$RAMA_RUN" --base main \
            --title 'chore(auditoría): regenerar radiografía de estructura' \
            --body 'Radiografía del repo regenerada por `.github/workflows/auditoria.yml`.

          Va por PR y no por push a `main` porque el ruleset «main - CI obligatorio» exige checks en verde y `github-actions[bot]` no puede saltárselo. Lo mergea `rutinas-automerge.yml` en cuanto la CI pase.

          La rama lleva el id de la pasada porque reutilizar una rama con PR abierto deja el PR sin los checks *required*: un force-push desde Actions no vuelve a disparar la CI.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_'
          echo "PR de radiografía abierto sobre $RAMA_RUN."

      # Inyecta el índice de funciones en Supabase (tabla mapa_arquitectura) para el Director de
      # código. SOLO desde main: la tabla es estado global único → las ramas de feature no la pisan.
      # No mete DATABASE_URL en CI: llama al puerto interno con CRON_SECRET (mismo patrón que las
      # rutinas Claude → /api/internal/alerta). Se omite silenciosamente si faltan los secrets.
      - name: Inyectar mapa de funciones en Supabase
        if: github.ref_name == 'main'
        env:
          PLATAFORMA_URL: ${{ secrets.PLATAFORMA_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$PLATAFORMA_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "PLATAFORMA_URL/CRON_SECRET no configurados — se omite la inyección."
            exit 0
          fi
          # Reintentos con backoff: cuando este push a main ADEMÁS redespliega plataforma, el
          # endpoint puede tardar en estar vivo → 404 transitorio. Reintentamos ~2.5 min. Un 401
          # (CRON_SECRET no coincide con Vercel) NO se reintenta: esperar no lo arregla.
          code=000
          for intento in 1 2 3 4 5 6; do
            code=$(curl -sS -o /tmp/mapa-resp.json -w '%{http_code}' \
              -X POST "$PLATAFORMA_URL/api/internal/mapa-arquitectura" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H 'Content-Type: application/json' \
              --data-binary @docs/mapa-funciones.generated.json || echo 000)
            echo "Intento $intento → HTTP $code"
            [ "$code" = "200" ] && break
            head -c 200 /tmp/mapa-resp.json 2>/dev/null || true; echo
            if [ "$code" = "401" ]; then
              echo "401: el CRON_SECRET de GitHub no coincide con el de Vercel — no reintento."
              break
            fi
            if [ "$intento" -lt 6 ]; then
              echo "No-200 (deploy de prod puede estar en curso). Reintento en $((intento*15))s…"
              sleep $((intento*15))
            fi
          done
          [ "$code" = "200" ] || { echo "Inyección del mapa falló tras los reintentos (HTTP $code)"; exit 1; }
          echo "Inyección OK (HTTP 200)."

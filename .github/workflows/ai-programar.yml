name: IA — programar (orquestador Fase 2)

# Orquestador AUTÓNOMO del "caro planifica / barato ejecuta", SOLO bajo disparo MANUAL
# (workflow_dispatch — nunca en push). Dada una orden, corre scripts/ai-programar.mjs
# (acota → planifica con Claude alto → ejecuta con el coder barato → aplica) y, si hubo
# cambios, abre un PR **draft** + avisa por Telegram. NUNCA mergea: el humano revisa y
# verifica. El código del coder barato no llega a main sin revisión.
#
# Requiere secrets de repo: PLATAFORMA_URL, AI_GATEWAY_SECRET (y opcional ALERTA_TOKEN
# para el aviso Telegram). Si faltan, el paso correspondiente degrada sin romper.

on:
  workflow_dispatch:
    inputs:
      tarea:
        description: 'Orden de desarrollo (mecánica/voluminosa; la lógica sutil hazla a mano)'
        required: true
        type: string
      topN:
        description: 'Nº máximo de archivos candidatos del acotado'
        required: false
        default: '6'
        type: string

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: ai-programar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  programar:
    name: Planifica caro / ejecuta barato
    runs-on: ubuntu-latest
    # 15 min de orquestación + hasta 15 min esperando el veredicto de CI (tests.yml
    # typechequea la app tocada automáticamente en cuanto se abre el PR).
    timeout-minutes: 35
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Orquestar (acota → planifica → ejecuta → aplica)
        env:
          PLATAFORMA_URL: ${{ secrets.PLATAFORMA_URL }}
          AI_GATEWAY_SECRET: ${{ secrets.AI_GATEWAY_SECRET }}
        run: |
          if [ -z "$PLATAFORMA_URL" ] || [ -z "$AI_GATEWAY_SECRET" ]; then
            echo "::error::Faltan secrets PLATAFORMA_URL y/o AI_GATEWAY_SECRET"; exit 1
          fi
          node scripts/ai-programar.mjs --tarea "${{ inputs.tarea }}" --topN "${{ inputs.topN }}"

      - name: ¿Hubo cambios?
        id: diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "cambios=si" >> "$GITHUB_OUTPUT"
            echo "resumen<<EOF" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "cambios=no" >> "$GITHUB_OUTPUT"
            echo "El orquestador no produjo cambios (acotado vacío, plan vacío o el ejecutor no aplicó nada)."
          fi

      - name: Abrir PR draft
        id: pr
        if: steps.diff.outputs.cambios == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="ai/programar-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "ai(programar): ${{ inputs.tarea }}

          Generado por el orquestador Fase 2 (Claude alto planifica / coder barato ejecuta).
          El typecheck automático (tests.yml) se anota en el PR en cuanto termina;
          revisa igualmente la LÓGICA del diff antes de mergear."
          git push -u origin "$BRANCH"
          # `gh pr create` requiere el ajuste del repo "Allow GitHub Actions to create and approve
          # pull requests" (Settings → Actions → General → Workflow permissions). Si está APAGADO,
          # GitHub devuelve "not permitted to create pull requests" → NO fallamos el run por eso:
          # la rama YA está pusheada; imprimimos el enlace para abrir el PR a mano. Enciende el ajuste
          # y los próximos runs abrirán el PR draft solos.
          MANUAL_URL="https://github.com/${{ github.repository }}/pull/new/$BRANCH"
          if gh pr create --draft --base main --head "$BRANCH" \
            --title "ai(programar): ${{ inputs.tarea }}" \
            --body "$(printf '## Generado por el orquestador Fase 2 (IA)\n\n**Orden:** %s\n\n⚠️ El código lo escribió un modelo coder BARATO a partir de un plan de Claude alto. El **typecheck automático** de `tests.yml` corre solo sobre este PR y su veredicto se comenta aquí abajo en cuanto termina — pero eso solo confirma que COMPILA, no que la LÓGICA es correcta: revísala igualmente. Nada se auto-mergea.\n\n### Archivos tocados\n\`\`\`\n%s\n\`\`\`\n\n🤖 Orquestador \`scripts/ai-programar.mjs\`' "${{ inputs.tarea }}" "${{ steps.diff.outputs.resumen }}")"; then
            NUM="$(gh pr view "$BRANCH" --json number -q .number)"
            echo "pr_number=$NUM" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No pude crear el PR automáticamente (activa 'Allow GitHub Actions to create and approve pull requests' en Settings → Actions → General). La rama '$BRANCH' está pusheada — abre el PR en: $MANUAL_URL"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
          fi

      # tests.yml se dispara solo (pull_request → main) en cuanto se abre el PR de arriba.
      # En vez de repetir aquí install+prisma+tsc (duplicaría minutos de Action), esperamos
      # a que termine y anotamos el veredicto real — así el PR nunca dice "sin verificar"
      # cuando en realidad ya se comprobó, y una revisión humana (o de Claude) sabe de
      # entrada si merece la pena mirar el diff o si hay que descartarlo.
      - name: Esperar veredicto de CI (typecheck/build)
        id: ci
        if: steps.pr.outputs.pr_number != ''
        continue-on-error: true
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ steps.pr.outputs.pr_number }}"
          sleep 15  # deja que GitHub registre el check-suite de tests.yml antes de preguntar
          if gh pr checks "$PR" --watch --interval 20; then
            echo "veredicto=verde" >> "$GITHUB_OUTPUT"
          else
            echo "veredicto=rojo" >> "$GITHUB_OUTPUT"
          fi

      - name: Anotar veredicto en el PR
        if: steps.pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ steps.pr.outputs.pr_number }}"
          RESUMEN="$(gh pr checks "$PR" 2>&1 || true)"
          VEREDICTO="${{ steps.ci.outputs.veredicto }}"
          if [ "$VEREDICTO" = "verde" ]; then
            TITULO="✅ CI en verde"
            NOTA="Compila (typecheck/build OK). Queda por revisar la LÓGICA del diff antes de mergear."
          elif [ "$VEREDICTO" = "rojo" ]; then
            TITULO="❌ CI en rojo"
            NOTA="**No mergear así.** El coder barato dejó algo roto — corrígelo o descarta el PR."
          else
            TITULO="⏳ CI sin confirmar a tiempo"
            NOTA="El paso de espera se agotó (15 min) o falló. Revisa el estado de los checks a mano en la pestaña Checks de este PR antes de mergear."
          fi
          gh pr comment "$PR" --body "$(printf '### %s\n\n%s\n\n```\n%s\n```\n\n🤖 Veredicto anotado por el orquestador Fase 2.' "$TITULO" "$NOTA" "$RESUMEN")"

      - name: Aviso Telegram (best-effort)
        if: steps.diff.outputs.cambios == 'si'
        env:
          PLATAFORMA_URL: ${{ secrets.PLATAFORMA_URL }}
          ALERTA_TOKEN: ${{ secrets.ALERTA_TOKEN }}
        run: |
          if [ -n "$PLATAFORMA_URL" ] && [ -n "$ALERTA_TOKEN" ]; then
            VEREDICTO="${{ steps.ci.outputs.veredicto }}"
            if [ "$VEREDICTO" = "verde" ]; then EMOJI="✅ CI verde"; elif [ "$VEREDICTO" = "rojo" ]; then EMOJI="❌ CI rojo — no mergear"; else EMOJI="⏳ CI sin confirmar (o PR sin abrir solo, revisa el run)"; fi
            curl -sS -X POST "$PLATAFORMA_URL/api/internal/alerta" \
              -H "Authorization: Bearer $ALERTA_TOKEN" -H 'Content-Type: application/json' \
              -d "$(printf '{"text":"🤖 orquestador IA: PR draft para «%s» — %s. Revisa la lógica antes de mergear."}' "${{ inputs.tarea }}" "$EMOJI")" || true
          else
            echo "Sin ALERTA_TOKEN: omito aviso Telegram."
          fi

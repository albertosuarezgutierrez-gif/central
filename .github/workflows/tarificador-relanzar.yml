# Relanza o prueba un trabajo del tarificador RPA SIN la pantalla de plataforma ni cookies de Alberto (15/10/2026):
# GitHub → Actions → «Tarificador RPA · relanzar» → Run workflow. Solo manual (workflow_dispatch).
#   · accion=relanzar → POST /api/operador/tarificador/relanzar { trabajoId }: el MISMO trabajo (atascado)
#     vuelve a `pendiente` con su mismo riesgo. 409 si el estado no vale / hay un trabajo vivo de la compañía; 429 pasado el
#     tope de 6 relanzamientos por compañía en 24 h.
#   · accion=probar   → POST /api/operador/tarificador/probar { clienteId, compania, ramo }: copia el riesgo del último
#     trabajo de ese cliente+compañía+ramo. Con `imagen` (opcional, 27/10/2026) lanza ESE trabajo con una imagen de RAMA
#     (`registry.fly.io/asegura-tarificador:rama-<sha7>`, la construye «Tarificador RPA · imagen» desde la rama): solo si
#     Alberto encendió `permitir_imagen_prueba` en `seguros.tarificador_imagen` (si no, 403). Nunca `main-*`.
#   · accion=explorar → POST /api/operador/tarificador/exploracion { entrada } (28/10/2026): UNA exploración IA SINTÉTICA
#     (sin cliente ni datos reales) de una entrada de la lista cerrada. Requiere TARIFICADOR_RPA_ACTIVO=1 y
#     TARIFICADOR_EXPLORADOR_ACTIVO=1 en central-asegura y la fila activa en companias_integracion (503/409 si no).
#   · accion=presupuesto → POST /api/operador/tarificador/presupuesto-rpa { oportunidadId, avisar:false } (01/11/2026):
#     prepara A MANO el presupuesto (BORRADOR) de una oportunidad con las ofertas de los trabajos ya hechos. No avisa
#     a nadie y no envía nada al cliente (TARIFICAR ≠ EMITIR).
# Secreto de repo REQUERIDO: ASEGURA_OPERADOR_SECRET (el Bearer del puerto de operador de asegura; ningún otro workflow
# lo usaba antes). Secreto/variable OPCIONAL: ASEGURA_URL (por defecto https://central-asegura.vercel.app).
# Nunca se imprime el secreto ni el riesgo: solo el estado HTTP y un JSON FILTRADO a claves sin datos personales.
name: Tarificador RPA · relanzar

on:
  workflow_dispatch:
    inputs:
      accion:
        description: 'relanzar (trabajo existente), probar (copia el riesgo del último trabajo del cliente), explorar (mapa del formulario, SINTÉTICO) o presupuesto (borrador de una oportunidad)'
        required: true
        type: choice
        options: [relanzar, probar, explorar, presupuesto]
        default: relanzar
      trabajo_id:
        description: 'accion=relanzar: uuid del trabajo (atascado)'
        required: false
        default: ''
      cliente_id:
        description: 'accion=probar: uuid del cliente'
        required: false
        default: ''
      compania:
        description: 'accion=probar: compañía (minúsculas, ej. allianz)'
        required: false
        default: ''
      ramo:
        description: 'accion=probar: ramo (ej. hogar)'
        required: false
        default: ''
      imagen:
        description: 'accion=probar (opcional): imagen de rama registry.fly.io/asegura-tarificador:rama-<sha7> (requiere el interruptor)'
        required: false
        default: ''
      oportunidad_id:
        description: 'accion=presupuesto: uuid de la oportunidad'
        required: false
        default: ''
      entrada:
        description: 'accion=explorar: clave de la lista cerrada compania:seccion:producto (ej. allianz:autos:movilidad_personal)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: tarificador-relanzar
  cancel-in-progress: false

jobs:
  relanzar:
    name: Llamar al puerto de operador
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACCION: ${{ inputs.accion }}
      TRABAJO_ID: ${{ inputs.trabajo_id }}
      CLIENTE_ID: ${{ inputs.cliente_id }}
      COMPANIA: ${{ inputs.compania }}
      RAMO: ${{ inputs.ramo }}
      IMAGEN: ${{ inputs.imagen }}
      ENTRADA: ${{ inputs.entrada }}
      OPORTUNIDAD_ID: ${{ inputs.oportunidad_id }}
      ASEGURA_URL: ${{ secrets.ASEGURA_URL || vars.ASEGURA_URL || 'https://central-asegura.vercel.app' }}
      ASEGURA_OPERADOR_SECRET: ${{ secrets.ASEGURA_OPERADOR_SECRET }}
    steps:
      # Las entradas llegan por `env` (nunca interpoladas en el script) y se validan ANTES de tocar el secreto.
      - name: Validar entradas
        run: |
          set -euo pipefail
          uuid='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          corto='^[a-z0-9_-]{1,40}$'
          if [ -z "$ASEGURA_OPERADOR_SECRET" ]; then echo "::error::Falta el secreto de repo ASEGURA_OPERADOR_SECRET"; exit 1; fi
          # Misma regex estricta que asegura (REGEX_IMAGEN_BOT) y solo etiquetas de rama: main-* es producción.
          imagen_rama='^registry\.fly\.io/asegura-tarificador:rama-[a-z0-9._-]{1,59}$'
          case "$ACCION" in
            relanzar)
              [[ "$TRABAJO_ID" =~ $uuid ]] || { echo "::error::trabajo_id no es un uuid"; exit 1; }
              [ -z "$IMAGEN" ] || { echo "::error::imagen solo vale con accion=probar"; exit 1; } ;;
            explorar)
              # Lista cerrada en asegura (esEntradaExploracion): aquí solo la forma. Sintética: sin cliente ni riesgo.
              [[ "$ENTRADA" =~ ^[a-z_]+:[a-z_]+:[a-z_]+$ ]] || { echo "::error::entrada no válida (compania:seccion:producto)"; exit 1; }
              [ -z "$IMAGEN" ] || { echo "::error::imagen solo vale con accion=probar"; exit 1; } ;;
            presupuesto)
              [[ "$OPORTUNIDAD_ID" =~ $uuid ]] || { echo "::error::oportunidad_id no es un uuid"; exit 1; }
              [ -z "$IMAGEN" ] || { echo "::error::imagen solo vale con accion=probar"; exit 1; } ;;
            probar)
              [[ "$CLIENTE_ID" =~ $uuid ]] || { echo "::error::cliente_id no es un uuid"; exit 1; }
              [[ "$COMPANIA" =~ $corto ]] || { echo "::error::compania no válida"; exit 1; }
              [[ "$RAMO" =~ $corto ]] || { echo "::error::ramo no válido"; exit 1; }
              if [ -n "$IMAGEN" ] && ! [[ "$IMAGEN" =~ $imagen_rama ]]; then
                echo "::error::imagen no válida: registry.fly.io/asegura-tarificador:rama-<sha7> (nunca main-*)"; exit 1
              fi ;;
            *) echo "::error::accion tiene que ser relanzar, probar, explorar o presupuesto"; exit 1 ;;
          esac
          case "$ASEGURA_URL" in https://*) ;; *) echo "::error::ASEGURA_URL tiene que ser https"; exit 1 ;; esac

      - name: Llamar a asegura
        run: |
          set -uo pipefail
          if [ "$ACCION" = "relanzar" ]; then
            ruta="relanzar"
            cuerpo=$(jq -cn --arg t "$TRABAJO_ID" '{trabajoId: $t}')
          elif [ "$ACCION" = "presupuesto" ]; then
            ruta="presupuesto-rpa"
            cuerpo=$(jq -cn --arg o "$OPORTUNIDAD_ID" '{oportunidadId: $o, avisar: false}')
          elif [ "$ACCION" = "explorar" ]; then
            ruta="exploracion"
            cuerpo=$(jq -cn --arg e "$ENTRADA" '{entrada: $e}')
          else
            ruta="probar"
            cuerpo=$(jq -cn --arg c "$CLIENTE_ID" --arg o "$COMPANIA" --arg r "$RAMO" --arg i "$IMAGEN" '{clienteId: $c, compania: $o, ramo: $r} + (if $i == "" then {} else {imagen: $i} end)')
          fi
          url="${ASEGURA_URL%/}/api/operador/tarificador/${ruta}"
          # El Bearer va por stdin (`--config -`): ni en la línea de órdenes ni en el log.
          http=$(printf 'header = "Authorization: Bearer %s"\n' "$ASEGURA_OPERADOR_SECRET" | curl -sS --config - \
            -o respuesta.json -w '%{http_code}' --max-time 60 -X POST "$url" \
            -H 'content-type: application/json' -H 'x-actor: agente:claude-actions' --data "$cuerpo") || http="000"
          echo "HTTP ${http} · accion=${ACCION}"
          # Solo claves sin PII, con valores acotados; lo demás no se imprime.
          jq -c 'if type == "object" then (with_entries(select(.key | IN("estado","motivo","mensaje","trabajoId","atascosDescartados","lanzado","duplicado","detalle","imagenPrueba","exploracionId","presupuestoId","conDatosReales"))) | map_values(if type == "string" then .[0:300] else . end)) + (if (.errores | type) == "array" then {campos: [.errores[] | tostring | split(":")[0] | .[0:60]]} else {} end) else {estado: "respuesta_no_objeto"} end' respuesta.json 2>/dev/null || echo '{"estado":"respuesta_no_json"}'
          rm -f respuesta.json
          case "$http" in 2*) exit 0 ;; *) exit 1 ;; esac

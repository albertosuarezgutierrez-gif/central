# Medición SEO semanal de las dos webs públicas — 27/09/2026.
#
# Auditoría DETERMINISTA (solo lectura) con `Hainrixz/claude-seo-ai`: dos notas que no se mezclan,
# «Search SEO» (Google) y «AI Visibility» (GEO/AEO: citabilidad en ChatGPT, Perplexity, AI
# Overviews…). Es el medidor que les faltaba a las skills `seo-asegura` y `seo-house-sevillana`:
# ellas llevan el criterio; esto da un número comparable semana a semana.
#
# 🚨 Solo se usa el `audit` de la action. El `fix` del plugin NO se usa ni se instala: escribiría
# en el código sin conocer nuestros guardianes (el diccionario ES→EN/IT de housesevillana, el copy
# vigilado por `lib/ramos.test.ts` de asegura-web). La action va FIJADA POR SHA: es código de
# terceros corriendo en nuestro CI, y una etiqueta se puede mover.
#
# Corre aquí y no en la sesión porque el contenedor de Claude no alcanza estos hosts (curl → 000).
# Sin gates: informa, no falla. Resultado = resumen del job + artefacto `seo-<web>` del run.
name: Medición SEO semanal

on:
  schedule:
    - cron: '17 5 * * 0' # domingo, antes de las rutinas SEO del lunes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-medicion
  cancel-in-progress: false

jobs:
  auditar:
    name: SEO · ${{ matrix.web }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - web: grupoasegura
            url: https://grupoasegura.es/
          - web: housesevillana
            url: https://housesevillana.es/
    steps:
      - name: claude-seo-ai audit
        uses: Hainrixz/claude-seo-ai@cabd6079dc1ae74682083ad3caf4e09bb1964404 # v0.2.0 · 06/09/2026
        with:
          url: ${{ matrix.url }}
          pages: '10'
          render: static
          lang: es
          environment: production
          artifact-name: seo-${{ matrix.web }}

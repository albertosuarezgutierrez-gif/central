  '/insurances/{id}/offers':
    post:
      tags:
        - Offer
      summary: Re-rate an insurance offer
      description: >
        Creates a new insurance offer by re-rating and packing together a
        `mainQuote` and, optionally, some

        compatible `addonQuotes` of an existing insurance.


        This operation is mandatory for offers whose quotes have the action
        `ReRate` as required amongst its

        `actions`. Once re-rated, new quotes shouldn't be required to re-rate
        again unless other

        restrictions apply (such as the offer being expired).


        Re-rating an offer is also needed if you want to modify any
        product-specific options, the

        payment method/frequency or the effective date.


        **See:** [Product Form](#overview--product-form-library) to be able to
        render and change the product options of each quote in

        your front-end app.


        **See:** The `List the roles of the insurance participants` operation of
        each line of insurance to

        determine if there are any fields required to perform the rating (the
        `requiredForRatingProducts`

        array). 


        **Note:** This operation can take more than a minute to complete
        depending on the timeout configured

        in the organization. Review the [Request
        Timeouts](#overview--request-timeouts) section if the

        operation ends unexpectedly.
      operationId: offers.reRateOffer
      parameters:
        - name: id
          in: path
          description: >-
            The identifier of the insurance project.<br/>**See:** [Search for
            insurances](#get-/insurances)
          required: true
          schema:
            type: integer
            format: int32
        - name: X-User-Email
          in: header
          description: The email of the user to execute the request in behalf of.
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        content:
          application/vnd.codeoscopic.v1+json:
            schema:
              $ref: '#/components/schemas/ReRateOfferRequest_V1'
      responses:
        '200':
          description: >-
            The new insurance offer with the re-rated quotes. <br/>**See:**
            [Overview errors](#overview--errors) if any error occurs to review
            the status code reason.
          content:
            application/vnd.codeoscopic.v1+json:
              schema:
                $ref: '#/components/schemas/GetOfferResponse_V1'
              examples:
                A re-rated insurance offer:
                  description: A re-rated insurance offer
                  $ref: >-
                    https://api-int.codeoscopic.io/doc/examples/offers/re-rated-offer.json

  /motorcycle/person-roles:
    get:
      tags:
        - Motorcycle insurance line
      summary: List the roles of the insurance participants
      description: >+
        Lists the roles of the persons participating in the insurance.


        There can be different persons involved in an insurance. And each person
        can play a single role or

        multiple roles depending on the line of insurance: holder, insured,
        owner, etc.


        In order to build a [quote](#post-/insurances) request or an

        [insurance policy
        applications](#post-/insurances/-id-/policy-applications) request, you
        will

        need to know what roles must be satisfied and what fields are required
        for each one of them. You can

        use this operation to obtain that information.


        Generally, you should specify in the
        [X-User-Email](#overview--request-headers) header the same

        user's email that you will be using later in the quote or insurance
        policy applications operation.

        This header will limit the scope of the operation to those products
        active in the user's

        organization.


        Additionally, in order to build an

        [insurance policy
        applications](#post-/insurances/-id-/policy-applications)

        request should specify the `offerId` parameter to obtain the fields and
        roles required to apply for

        the insurances quoted in the offer.


        Each role returned is described with a list of fields that may be
        required or not. Moreover, there

        are other properties that will help you to shape the relationship with
        other roles and its

        constraints.


        Fields returned as `required` are mandatory to [get a
        quote](#post-/insurances). Additionally, the

        `requiredForRatingProducts` array specifies the products that require
        the field to

        [complete the rating](#post-/insurances/-id-/offers).


        **Note:** We strongly recommend sending all fields with
        `requiredForRatingProducts` to obtain

        fully-rated quotes. Also, keep in mind that

        [incorporating or modifying these fields in the
        insurance](#patch-/insurances/-id-)

        after quoting will invalidate any previous quotes of the specified
        products (they will need to be

        re-rated).


      operationId: motorcycle.getPersonRoles
      parameters:
        - name: X-User-Email
          in: header
          description: The email of the user to execute the request in behalf of.
          schema:
            type: string
        - name: offerId
          in: query
          description: >-
            If an offer identifier is specified, the response will contain the
            roles and fields available/required to apply for the insurances
            quoted in the offer.<br/>**See:** [Retrieve an insurance
            offer](#get-/insurances/-id-/offers/-offerId-).<br/>**See:** [Submit
            insurance policy
            applications](#post-/insurances/-id-/policy-applications).
          schema:
            type: integer
            format: int32
        - name: holderIsJuridicalPerson
          in: query
          description: Whether the holder is a juridical person or not.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          content:
            application/vnd.codeoscopic.v1+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonRole_V1'
              examples:
                Motorcycle insurance roles:
                  description: Motorcycle insurance roles
                  $ref: >-
                    https://api-int.codeoscopic.io/doc/examples/motorcycle/person-roles-response.json

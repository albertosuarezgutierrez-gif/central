                description: Motorcycle insurance
                $ref: >-
                  https://api-int.codeoscopic.io/doc/examples/motorcycle/quotation-request.json
              Home insurance:
                description: Home insurance
                $ref: >-
                  https://api-int.codeoscopic.io/doc/examples/home/quotation-request.json
              Term life insurance:
                description: Term life insurance
                $ref: >-
                  https://api-int.codeoscopic.io/doc/examples/term-life/quotation-request.json
              Health insurance:
                description: Health insurance
                $ref: >-
                  https://api-int.codeoscopic.io/doc/examples/health/quotation-request.json
              Burial insurance:
                description: Burial insurance
                $ref: >-
                  https://api-int.codeoscopic.io/doc/examples/burial/quotation-request.json
        required: true
      responses:
        '200':
          description: The new insurance project with its quotes.
          content:
            application/vnd.codeoscopic.v1+json:
              schema:
                $ref: '#/components/schemas/Insurance_V1'
              examples:
                Car insurance:
                  description: Car insurance
                  $ref: >-
                    https://api-int.codeoscopic.io/doc/examples/car/quotation-response.json
                Motorcycle insurance:
                  description: Motorcycle insurance
                  $ref: >-
                    https://api-int.codeoscopic.io/doc/examples/motorcycle/quotation-response.json
                Home insurance:
                  description: Home insurance
                  $ref: >-
                    https://api-int.codeoscopic.io/doc/examples/home/quotation-response.json
                Term life insurance:
                  description: Term life insurance
                  $ref: >-
                    https://api-int.codeoscopic.io/doc/examples/term-life/quotation-response.json
                Health insurance:
                  description: Health insurance
                  $ref: >-
                    https://api-int.codeoscopic.io/doc/examples/health/quotation-response.json

        holder:
          description: >-
            The person entitled to be the holder of the policy.<br/>**See:** The
            `List the roles of the insurance participants` operation of each
            line of insurance to determine what fields are required.
          oneOf:
            - $ref: '#/components/schemas/NaturalPerson_V1'
            - $ref: '#/components/schemas/JuridicalPerson_V1'

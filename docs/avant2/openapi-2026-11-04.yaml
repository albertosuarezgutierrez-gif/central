  /claims:
    get:
      tags:
        - Claim
      summary: Search for claims
      description: Searches for claims based on a search criteria.
      operationId: claim.search
      parameters:
        - name: X-User-Email
          in: header
          description: The email of the user to execute the request in behalf of.
          required: true
          schema:
            type: string
        - name: pageNumber
          in: query
          description: >-
            The page number indicating which set of items will be returned in
            the response. For example, the combination of `pageNumber=1` and
            `pageSize=20` returns the first 20 items, or the combination of
            `pageNumber=3` and `pageSize=20` returns items 41 through 60.
          schema:
            type: integer
            format: int64
            default: 1
            minimum: 1
        - name: pageSize
          in: query
          description: The number of items to return in the response.
          schema:
            type: integer
            format: int64
            default: 10
            maximum: 100
            minimum: 1
        - name: policyId
          in: query
          description: Limits the response to claims associated with the specified policy.
          schema:
            type: string
        - name: statusId
          in: query
          description: >-
            Limits the response to claims whose status is the specified
            one.<br/>**See:** [List claim statuses](#get-/claim-statuses).
          schema:
            type: string
        - name: fromStatusDate
          in: query
          description: >-
            Limits the response to claims whose status was set on or after the
            specified date.<br/>**Format:** yyyy-MM-dd (<a
            href='https://en.wikipedia.org/wiki/ISO_8601' target='_blank'>ISO
            8601</a>)
          schema:
            type: string
            format: date
        - name: toStatusDate
          in: query
          description: >-
            Limits the response to claims whose status was set on or before the
            specified date.<br/>**Format:** yyyy-MM-dd (<a
            href='https://en.wikipedia.org/wiki/ISO_8601' target='_blank'>ISO
            8601</a>)
          schema:
            type: string
            format: date
        - name: fromUpdateDate
          in: query
          description: >-
            Limits the response to claims whose update date is on or after the
            specified date.<br/>**Format:** yyyy-MM-dd (<a
            href='https://en.wikipedia.org/wiki/ISO_8601' target='_blank'>ISO
            8601</a>)
          schema:
            type: string
            format: date
        - name: toUpdateDate
          in: query
          description: >-
            Limits the response to claims whose update date is on or before the
            specified date.<br/>**Format:** yyyy-MM-dd (<a
            href='https://en.wikipedia.org/wiki/ISO_8601' target='_blank'>ISO
            8601</a>)
          schema:
            type: string
            format: date
        - name: officeId
          in: query
          description: >-
            <span style="color:#FFA500">[TBM]</span> Limits the response to
            claims whose office is the specified one.
          schema:
            type: string
        - name: clientId
          in: query
          description: Limits the response to claims whose client is the specified one.
          schema:
            type: string
      responses:
        '200':
          content:
            application/vnd.codeoscopic.v1+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClaimSummary_V1'
              examples:
                ClaimSummary:
                  description: ClaimSummary
                  $ref: >-
                    https://api-int.codeoscopic.io/doc/examples/claim/claim-summary-response.json

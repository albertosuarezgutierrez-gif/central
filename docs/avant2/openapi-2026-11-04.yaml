  '/insurances/{id}/policy-applications/{policyApplicationId}':
    get:
      tags:
        - Policy application
      summary: Retrieve an insurance policy application
      description: >-
        Retrieves an insurance policy application.


        **See:** [List insurance policy application
        statuses](#get-/policy-application-statuses) to list

        the possible outcomes of insurance policy applications.


        Generally, insurance policy applications will be approved or rejected
        depending on whether they meet

        some final validations performed by insurance vendors.


        However, applications can also be accepted but held pending for
        eligibility review or in need for

        manual intervention by the broker (via ASM or the vendor's web).


        Moreover, in certain scenarios insurance vendors can also decide not to
        accept nor reject the

        application but propose certain changes to the quote, usually in the
        form of a new premium. In this

        case the `RevisedQuote` status is returned alongside a `revisedQuote`
        that incorporates the

        proposed modifications. These changes must be carefully reviewed and, if
        accepted, a new

        [submit insurance policy
        applications](#post-/insurances/-id-/policy-applications) request should
        be

        executed specifying the revised quote instead of the original one as the
        source `quote` of the

        application.
      operationId: policyApplications.getPolicyApplication
      parameters:
        - name: id
          in: path
          description: >-
            The identifier of the insurance project.<br/>**See:** [Search for
            insurances](#get-/insurances)
          required: true
          schema:
            type: integer
            format: int32
        - name: policyApplicationId
          in: path
          description: >-
            The identifier of the insurance policy application.<br/>**See:**
            [Retrieve an insurance project](#get-/insurances/-id-).
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/vnd.codeoscopic.v1+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PolicyApplication_V1'
              examples:
                Insurance policy application:
                  description: Insurance policy application
                  $ref: >-
                    https://api-int.codeoscopic.io/doc/examples/policy-applications/get-policy-application-response.json

                  $ref: >-
                    https://api-int.codeoscopic.io/doc/examples/burial/quotation-response.json
    patch:
      tags:
        - Insurance
      summary: Update an insurance project
      description: >-
        Updates an insurance project.


        This operation allows you to complete or modify the data in the 
        insurance project to satisfy the

        requirements for obtaining confirmed prices and applying for an
        insurance policy.


        **Note:** Only the fields that appear in the request's schema can be
        updated, the rest will be

        discarded.<br/>


        **Note:** This is an <u>incremental</u> update operation, any fields not
        included in the request

        will remain unchanged.


        **See:** The `List the roles of the insurance participants` operation of
        each line of insurance to

        determine which person role fields are required and are modifiable.
      operationId: insurance.patchInsurance
      parameters:
        - name: id
          in: path
          description: The identifier of the insurance project to update.
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        content:
          application/vnd.codeoscopic.v1+json:
            schema:
              $ref: '#/components/schemas/InsurancePatch_V1'
            examples:
              Car insurance patch:
                description: Car insurance patch
                $ref: >-
                  https://api-int.codeoscopic.io/doc/examples/car/insurance-patch.json
              Motorcycle insurance patch:
                description: Motorcycle insurance patch
                $ref: >-
                  https://api-int.codeoscopic.io/doc/examples/motorcycle/insurance-patch.json
              Home insurance patch:
                description: Home insurance patch
                $ref: >-
                  https://api-int.codeoscopic.io/doc/examples/home/insurance-patch.json
      responses:
        '204':
          description: >-
            The insurance was successfully updated.<br/>**See:** [Retrieve an
            insurance project](#get-/insurances/-id-) to retrieve the updated
            insurance project.
          content:
            application/vnd.codeoscopic.v1+json: {}
  /insurances:
    get:
      tags:
        - Insurance
      summary: Search for insurance projects
      description: >-
        Searches for insurance projects based on a search
        criteria.<br/><br/>**Note:** The date range cannot be wider than 1 year.
      operationId: insurance.search
      parameters:
        - name: id
          in: query
          description: Searches for a specific insurance project based on its identifier.
          schema:
            type: integer
            format: int32
        - name: externalId
          in: query
          description: >-
            Limits the response to insurance projects associated with the
            external identifier.
          schema:
            type: string
        - name: insuranceLineId
          in: query
          description: >-
            Limits the response to insurance projects of a specific line of
            insurance.<br/>**See:** [List insurance
            lines](#get-/insurance-lines) field `id`.
          schema:
            type: string
        - name: fromDate
          in: query
          description: >-
            Limits the response to insurance projects created on or after the
            specified date. If `policyApplicationSubmitted` is true, the policy
            application date becomes the search criteria.<br/>**Required:** if
            `id` and `externalId` are not specified.<br/>**Format:** yyyy-MM-dd
            (<a href='https://en.wikipedia.org/wiki/ISO_8601'
            target='_blank'>ISO 8601</a>)
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          description: >-
            Limits the response to insurance projects created on or before the
            specified date. If `policyApplicationSubmitted` is true, the policy
            application date becomes the search criteria.<br/>**Required:** if
            `id` and `externalId` are not specified.<br/>**Format:** yyyy-MM-dd
            (<a href='https://en.wikipedia.org/wiki/ISO_8601'
            target='_blank'>ISO 8601</a>)
          schema:
            type: string
            format: date
        - name: holderIdentification
          in: query
          description: >-
            Limits the response to insurance projects whose holder has the
            specified identification.
          schema:
            type: string
        - name: policyApplicationSubmitted
          in: query
          description: >-
            Limits the response to insurance projects for which at least one
            insurance policy application has been submitted, if true, or those
            that do not have any insurance policy submissions, if false.
          schema:
            type: boolean
            enum:
              - true
              - false
        - name: policyApplicationStatusIds
          in: query
          description: >-
            Limits the response to insurance projects that have at least one
            insurance policy application in any of the specified statuses
            (implies that `policyApplicationSubmitted` will be considered
            true).<br/>**See:** [List policy applications
            statuses](#get-/policy-application-statuses).
          schema:
            type: string
        - name: pageNumber
          in: query
          description: >-
            The page number indicating which set of items will be returned in
            the response. For example, the combination of `pageNumber=1` and
            `pageSize=20` returns the first 20 items, or the combination of
            `pageNumber=3` and `pageSize=20` returns items 41 through 60.
          schema:
            type: integer
            format: int64
            default: 1
            minimum: 1
        - name: pageSize
          in: query
          description: The number of items to return in the response.
          schema:
            type: integer
            format: int64
            default: 10
            maximum: 100
            minimum: 1
      responses:
        '200':
          description: >-
            The insurance projects that match the specified
            criteria.<br/>**Note:** The response consists of limited
            representations of the insurance projects that contain only a subset

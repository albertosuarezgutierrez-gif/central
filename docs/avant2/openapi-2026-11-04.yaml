    InsuranceQuoteActionSchema:
      oneOf:
        - $ref: '#/components/schemas/ReRateAction'
        - $ref: '#/components/schemas/SubmitPolicyApplicationAction'
    ReRateAction:
      type: object
      description: >-
        If present, indicates that the quote can/must be re-rated.<br/>**See:**
        [Re-rate an insurance offer](#post-/insurances/-id-/offers)
      properties:
        id:
          type: string
          default: ReRate
        required:
          type: boolean
          description: >-
            Whether the action is mandatory to be able to submit an insurance
            policy application.
        addressNormalizationRequired:
          type: boolean
          description: >-
            Whether it's necessary to normalize the address of the risk before
            re-rating the quote.<br/>**See:** [List
            roads](#get-/provinces/-provinceId-/municipalities/-municipalityId-/roads)
            with the `source` parameter set to `ProductSpecific` to obtain the
            normalized road of the risk address.<br/>**See:** [Update an
            insurance project](#patch-/insurances/-id-) to add the normalized
            road to the `normalizations` field of the risk address.
      required:
        - addressNormalizationRequired
        - id
        - required
      title: ReRate
    SubmitPolicyApplicationAction:
      type: object
      description: >-
        If present, indicates that the quote can be used to apply for an
        insurance policy.
      properties:
        id:
          type: string
          default: SubmitPolicyApplicationAction
        checkFields:
          type: boolean
          description: >-
            Whether it's necessary to check if adding more risk fields is
            needed.<br/>**See:** [Check policy application
            fields](#post-/insurances/-id-/policy-application-fields)
        checkDocuments:
          type: boolean
          description: >-
            Whether it's necessary to check if downloading or attaching
            documentation is needed.<br/>**See:** [Check policy application
            documents](#post-/insurances/-id-/policy-application-documents)
        paymentBankAccountRequired:
          type: boolean
          description: >-
            Whether the bank account information is required to submit an
            insurance policy application.
        paymentCreditCardRequired:
          type: boolean
          description: >-
            Whether the credit card information is required to submit an
            insurance policy application.
        addressNormalizationRequired:
          type: boolean
          description: >-
            Whether it's necessary to normalize the primary address of the
            holder before submitting the policy application.<br/>**See:** [List
            roads](#get-/provinces/-provinceId-/municipalities/-municipalityId-/roads)
            with the `source` parameter set to `ProductSpecific` to obtain the
            normalized road of the holder's primary address.<br/>**See:**
            [Update an insurance project](#patch-/insurances/-id-) to add the
            normalized road to the `normalizations` field of the holder's
            primary address.
      required:
        - addressNormalizationRequired
        - checkDocuments
        - checkFields
        - id
        - paymentBankAccountRequired
        - paymentCreditCardRequired
      title: SubmitPolicyApplication

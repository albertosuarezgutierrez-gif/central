  '/provinces/{provinceId}/municipalities/{municipalityId}/roads':
    get:
      tags:
        - Location
      summary: List roads
      description: >-
        Lists the roads of a municipality from:

        - The <a href='https://www.sedecatastro.gob.es/' target='_blank'>Spanish
        cadastre</a> when `source`

        is `Cadastre`.

        - A vendor's service when `source` is `ProductSpecific`.


        Most products do not require matching roads against their own road
        registries or may simply accept

        cadastral references.

        However, some products require <b>address normalization</b>.


        Address normalization is the process of searching for roads using
        product-specific services and

        attaching the selected result to the insurance project.


        To perform address normalization:

        - Execute this operation with `source` set to `ProductSpecific` and
        providing the `productId` of the

        quote.

        - Select the appropriate road from the response and

        [update the insurance project](#patch-/insurances/-id-) adding the
        selected road to the

        `normalizations` field of the address that requires normalization.


        This typically applies to the policyholder’s address when submitting
        policy applications, or to the

        risk address when re-rating real estate property insurance.
      operationId: location.getRoads
      parameters:
        - name: provinceId
          in: path
          description: >-
            The identifier of the province.<br/>**See:** [List
            provinces](#get-/provinces).
          required: true
          schema:
            type: string
            format: '^\d{2}$'
          example: 28
        - name: municipalityId
          in: path
          description: >-
            The identifier of the municipality.<br/>**See:** [List
            municipalities](#get-/provinces/-provinceId-/municipalities).
          required: true
          schema:
            type: string
            format: '^\d{3}$'
          example: 134
        - name: name
          in: query
          description: The name of the road.
          required: true
          schema:
            type: string
          example: MARIA CURIE
        - name: source
          in: query
          description: The road registry against which the search is performed.
          schema:
            type: string
            default: Cadastre
            enum:
              - Cadastre
              - ProductSpecific
          example: Cadastre
        - name: productId
          in: query
          description: >-
            Identifies the product when `source` is
            'ProductSpecific'.<br/>**Required:** if `source` is
            'ProductSpecific'.
          schema:
            type: integer
            format: int32
      responses:
        '200':
          content:
            application/vnd.codeoscopic.v1+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Road_V1'

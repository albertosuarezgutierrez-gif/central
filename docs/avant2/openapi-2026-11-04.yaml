      type: object
      description: >-
        If present, indicates that the quote can be used to apply for an
        insurance policy.
      properties:
        id:
          type: string
          default: SubmitPolicyApplicationAction
        checkFields:
          type: boolean
          description: >-
            Whether it's necessary to check if adding more risk fields is
            needed.<br/>**See:** [Check policy application
            fields](#post-/insurances/-id-/policy-application-fields)
        checkDocuments:
          type: boolean
          description: >-
            Whether it's necessary to check if downloading or attaching
            documentation is needed.<br/>**See:** [Check policy application
            documents](#post-/insurances/-id-/policy-application-documents)

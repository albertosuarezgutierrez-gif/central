  /policies:
    get:
      tags:
        - Policy
      summary: Search for insurance policies
      description: Searches for insurance policies based on a search criteria.
      operationId: insurancePolicy.search
      parameters:
        - name: X-User-Email
          in: header
          description: The email of the user to execute the request in behalf of.
          required: true
          schema:
            type: string
        - name: pageNumber
          in: query
          description: >-
            The page number indicating which set of items will be returned in
            the response. For example, the combination of `pageNumber=1` and
            `pageSize=20` returns the first 20 items, or the combination of
            `pageNumber=3` and `pageSize=20` returns items 41 through 60.
          schema:
            type: integer
            format: int64
            default: 1
            minimum: 1
        - name: pageSize
          in: query
          description: The number of items to return in the response.
          schema:
            type: integer
            format: int64
            default: 10
            maximum: 100
            minimum: 1
        - name: policyNumber
          in: query
          description: >-
            Limits the response to insurance policies with the specified policy
            number.
          schema:
            type: string
        - name: certificateNumber
          in: query
          description: >-
            Limits the response to insurance policies with the specified
            certificate number.
          schema:
            type: string
        - name: fromEffectiveDate
          in: query
          description: >-
            Limits the response to insurance policies whose effective date is on
            or after the specified date.<br/>**Format:** yyyy-MM-dd (<a
            href='https://en.wikipedia.org/wiki/ISO_8601' target='_blank'>ISO
            8601</a>)
          schema:
            type: string
            format: date
        - name: toEffectiveDate
          in: query
          description: >-
            Limits the response to insurance policies whose effective date is on
            or before the specified date.<br/>**Format:** yyyy-MM-dd (<a
            href='https://en.wikipedia.org/wiki/ISO_8601' target='_blank'>ISO
            8601</a>)
          schema:
            type: string
            format: date
        - name: fromExpirationDate
          in: query
          description: >-
            Limits the response to insurance policies whose expiration date is
            on or after the specified date.<br/>**Format:** yyyy-MM-dd (<a
            href='https://en.wikipedia.org/wiki/ISO_8601' target='_blank'>ISO
            8601</a>)
          schema:
            type: string
            format: date
        - name: toExpirationDate
          in: query
          description: >-
            Limits the response to insurance policies whose expiration date is
            on or before the specified date.<br/>**Format:** yyyy-MM-dd (<a
            href='https://en.wikipedia.org/wiki/ISO_8601' target='_blank'>ISO
            8601</a>)
          schema:
            type: string
            format: date
        - name: statusId
          in: query
          description: >-
            Limits the response to insurance policies whose current status is
            the specified one.
          schema:
            type: string
        - name: fromStatusDate
          in: query
          description: >-
            Limits the response to insurance policies whose current status was
            set on or after the specified date.<br/>**Format:** yyyy-MM-dd (<a
            href='https://en.wikipedia.org/wiki/ISO_8601' target='_blank'>ISO
            8601</a>)
          schema:
            type: string
            format: date
        - name: toStatusDate
          in: query
          description: >-
            Limits the response to insurance policies whose current status was
            set on or before the specified date.<br/>**Format:** yyyy-MM-dd (<a
            href='https://en.wikipedia.org/wiki/ISO_8601' target='_blank'>ISO
            8601</a>)
          schema:
            type: string
            format: date
        - name: fromUpdateDate
          in: query
          description: >-
            Limits the response to insurance policies whose update date is on or
            after the specified date.<br/>**Format:** yyyy-MM-dd (<a
            href='https://en.wikipedia.org/wiki/ISO_8601' target='_blank'>ISO
            8601</a>)
          schema:
            type: string
            format: date
        - name: toUpdateDate
          in: query
          description: >-
            Limits the response to insurance policies whose update date is on or
            before the specified date.<br/>**Format:** yyyy-MM-dd (<a
            href='https://en.wikipedia.org/wiki/ISO_8601' target='_blank'>ISO
            8601</a>)
          schema:
            type: string
            format: date
        - name: insuranceLineId
          in: query
          description: >-
            Limits the response to insurance policies of a specific line of
            insurance.<br/>**See:** [List insurance
            lines](#get-/insurance-lines) field `id`.
          schema:
            type: string
        - name: companyCode
          in: query
          description: >-
            Limits the response to insurance policies issued by the company with
            the specified code.<br/>**See:** [List insurance
            companies](#get-/insurance-companies) field `code`.
          schema:
            type: string
        - name: collaboratorId
          in: query
          description: >-
            <span style="color:#FFA500">[TBM]</span> Limits the response to
            policies whose `collaborators` include the specified one.
          schema:
            type: string
        - name: officeId
          in: query
          description: >-
            Limits the response to insurance policies assigned to the specified
            office.
          schema:
            type: string
        - name: clientGroupIds
          in: query
          description: >-
            Limits the response to insurance policies whose policyholders belong
            to any of the specified client groups.
          schema:
            type: string
        - name: clientId
          in: query
          description: >-
            Limits the response to insurance policies whose policyholder has the
            specified `id`.<br/>**See:** [Search for clients](#get-/clients)
            field `id`.
          schema:
            type: string
        - name: clientIdentificationDocumentId
          in: query
          description: >-
            Limits the response to insurance policies whose policyholder has the
            specified identification document.<br/>**See:** [Search for
            clients](#get-/clients) field `identificationDocument.id`.
          schema:
            type: string
      responses:
        '200':
          description: The insurance policies that match the specified criteria.
          content:
            application/vnd.codeoscopic.v1+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InsurancePolicySummary_V1'
              examples:
                Insurance policy summary:
                  description: Insurance policy summary
                  $ref: >-
                    https://api-int.codeoscopic.io/doc/examples/policy/policy-summary-response.json

        type:
          $ref: '#/components/schemas/ReceiptTypeImplementation_V1'
          example:
            id: Renewal
            name: Cartera
        creationDateTime:
          type: string
          format: date-time
          description: >-
            The date and time of registration/activation of the insurance
            policy.<br/>**Format:** yyyy-MM-dd'T'HH:mm:ssZ (<a
            href='https://en.wikipedia.org/wiki/ISO_8601' target='_blank'>ISO
            8601</a>)
          readOnly: true
        updateDateTime:
          type: string
          format: date-time
          description: >-
            The date and time of the last update of the insurance
            policy.<br/>**Format:** yyyy-MM-dd'T'HH:mm:ssZ (<a
            href='https://en.wikipedia.org/wiki/ISO_8601' target='_blank'>ISO

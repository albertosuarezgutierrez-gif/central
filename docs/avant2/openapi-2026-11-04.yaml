  '/insurances/{id}/policy-applications':
    post:
      tags:
        - Policy application
      summary: Submit insurance policy applications
      description: >
        The submission of an insurance policy application represents the
        intention to formalize a quote into

        an insurance policy.


        Using this operation you can formalize the quotes included in an

        [insurance offer](#get-/insurances/-id-/offers/-offerId-) into insurance
        policies. The application

        of the main product will be submitted first and, if accepted, the
        applications of the addons will

        be submitted next.


        In order to build the request you should previously check its
        requirements:

        * Only quotes that include the `SubmitPolicyApplication` action amongst
        its `actions` are

        suitable to be used in this operation. The absence of this action means
        that applying for this

        specific insurance is not supported yet via the API (although it might
        be possible via ASM). You

        should check for the presence of this action in the quotes and also
        inspect its properties because

        they may provide information about other requirements such as the
        `payment` details or the `files`

        that need to be attached.<br/>

        **See:** [Retrieve an insurance
        offer](#get-/insurances/-id-/offers/-offerId-) to inspect the

        `actions` of its quotes.



        * Also, ensure that the insurance contains all the required information
        about each of the persons 

        participating in it.<br/>

        **See:** The `List the roles of the insurance participants` operation of
        each line of insurance to

        obtain these requirements.<br/>

        **See:** [Patch an insurance project](#patch-/insurances/-id-) to add
        the required information to 

        the insurance.



        * Finally, bear in mind that each of the products included in the
        request may define a specific

        set of options some of which could be mandatory. Use the

        [Product Form Library](#overview--product-form-library) to obtain these
        options and include them in

        the `product.options` of each insurance policy application.



        If the request is accepted, the response will contain an insurance
        policy application created per

        each one included in the request.


        **See:** [Retrieve an insurance policy
        application](#get-/insurances/-id-/policy-applications/-policyApplicationId-)

        for information about the returned applications.
      operationId: policyApplications.submit
      parameters:
        - name: X-User-Email
          in: header
          description: >-
            The email of the user to execute the request in behalf
            of.<br/>**Note:** Requests will be `forbidden` if the user is not
            allowed to submit policy applications.
          required: true
          schema:
            type: string
            minLength: 1
        - name: id
          in: path
          description: >-
            The identifier of the insurance project.<br/>**See:** [Search for
            insurances](#get-/insurances)
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        description: >-
          A multipart body with <a
          href="https://datatracker.ietf.org/doc/html/rfc7578"
          target="_blank">multipart/form-data</a> `Content-Type` composed
          of:<br/><ul><li>A single JSON body part named `policyApplications`
          that contains the array of insurance policy applications being
          submitted.</li><li>(*Upcoming*) Multiple file body parts named `files`
          that contain the documents/images to be attached to the
          applications.<br/>**Note:** The `Content-Disposition` header of each
          `files` body part must specify a `filename` parameter with a maximum
          length of 255 chars.<br/>**See:** [Retrieve an insurance
          offer](#get-/insurances/-id-/offers/-offerId-)</li></ul>
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                policyApplications:
                  $ref: '#/components/schemas/SubmitPolicyApplicationsRequest_V1'
                  description: The array of insurance policy applications being submitted.
                files:
                  type: array
                  items:
                    format: binary
                    description: 't:policyApplications.submit.request.body.files.description'
            encoding:
              policyApplications:
                contentType: application/json
              files:
                contentType: application/octet-stream
        required: true
      responses:
        '200':
          description: The insurance policy applications created.
          content:
            application/vnd.codeoscopic.v1+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PolicyApplication_V1'
              examples:
                Submit insurance policy applications response:
                  description: Submit insurance policy applications response
                  $ref: >-
                    https://api-int.codeoscopic.io/doc/examples/policy-applications/submit-policy-applications-response.json
        '403':
          description: If the user is not allowed to submit policy applications.

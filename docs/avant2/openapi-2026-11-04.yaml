            href='https://en.wikipedia.org/wiki/ISO_8601' target='_blank'>ISO
            8601</a>)
          readOnly: true
        effectiveDate:
          type: string
          format: date
          description: >-
            The effective date for the policy in case of issuing this
            quote.<br/>**Format:** yyyy-MM-dd (<a
            href='https://en.wikipedia.org/wiki/ISO_8601' target='_blank'>ISO
            8601</a>)
          readOnly: true
        expirationDate:
          type: string
          format: date
          description: >-
            The date after which the quote cannot be issued. **Note:** that it
            could be invalidated earlier because of additional vendor-specific
            constraints.<br/>**Format:** yyyy-MM-dd (<a
            href='https://en.wikipedia.org/wiki/ISO_8601' target='_blank'>ISO
            8601</a>)
          readOnly: true
        product:
          allOf:
            - $ref: '#/components/schemas/AddonInstance'
            - $ref: '#/components/schemas/GetOfferResponseProduct'
          description: The related insurance product instance.
        deductible:
          type: integer
          format: int32
          description: The deductible this quote is subject to.
          readOnly: true
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        paymentFrequency:
          $ref: '#/components/schemas/PaymentFrequency'
        coverageDescription:
          type: string
          description: The description of the coverage provided by the addon.
          readOnly: true
        messages:
          type: array
          description: A list of messages that should be reviewed by the user.
          items:
            $ref: '#/components/schemas/Message'
            readOnly: true
          readOnly: true
        links:
          type: array
          description: A list of links to related documents or information pages.
          items:
            $ref: '#/components/schemas/Link'
            readOnly: true
          readOnly: true
        downPayment:
          type: number
          format: double
          description: The amount that must be paid at the time of creating the policy.
          readOnly: true
        premium:
          type: number
          format: double
          description: The total policy premium for the current term.
          readOnly: true
        termMonths:
          type: integer
          format: int32
          description: >-
            The number of months in the policy term.<br/>**Required:** if
            `termDays` is null.
          readOnly: true
        termDays:
          type: integer
          format: int32
          description: >-
            The number of days in the policy term.<br/>**Required:** if
            `termMonths` is null.
          readOnly: true
        brokerFee:
          type: number
          format: double
          description: >-
            The commission charged by the broker to the client in return for
            assistance in procuring the insurance.
          readOnly: true
        estimate:
          type: boolean
          description: >-
            Whether the quote is an estimate, if true, or a confirmed price
            otherwise.
          readOnly: true
        referenceFromVendor:
          type: string
          description: A reference to the quote obtained from the vendor.
          readOnly: true
        actions:

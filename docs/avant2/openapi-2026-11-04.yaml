    CreatePolicyApplicationsReportRequestInsuranceVendor:
      type: object
      properties:
        id:
          type: integer
          format: int32
      required:
        - id
    CreatePolicyApplicationsReportRequestInsuranceLine_V1:
      type: object
      description: >-
        Limits the report to insurance policy applications of a specific line of
        insurance.<br/>**Note:** Only the lines of insurance whose
        `supports.policyApplicationsReport` flag is true are
        supported.<br/>**See:** [List insurance lines](#get-/insurance-lines).
      properties:
        id:
          type: string
      required:
        - id
    CreatePolicyApplicationsReportRequest_V1:
      allOf:
        - $ref: '#/components/schemas/CreateReportRequest_V1'
        - type: object
          properties:
            organizationId:
              type: integer
              format: int32
              description: >-
                The identifier of the sales organization to inspect (by default,
                the brokerage).<br/>**See:** [List sales
                organizations](#get-/sales-organizations).
            insuranceId:
              type: integer
              format: int32
              description: >-
                Limits the report to insurance policy applications of the
                specified insurance project.
            fromDate:
              type: string
              format: date
              description: >-
                Limits the report to insurance policy applications created on or
                after the specified date (by default, the current
                date).<br/><span style="color:#FF0000">**Deprecated:** Use
                `fromDateTime` instead.</span><br/><span
                style="color:#FF0000">**Removal:**
                2027-05-01.</span><br/>**Format:** yyyy-MM-dd (<a
                href='https://en.wikipedia.org/wiki/ISO_8601'
                target='_blank'>ISO 8601</a>)
            toDate:
              type: string
              format: date
              description: >-
                Limits the report to insurance policy applications created on or
                before the specified date (by default, the current
                date).<br/><span style="color:#FF0000">**Deprecated:** Use
                `toDateTime` instead.</span><br/><span
                style="color:#FF0000">**Removal:**
                2027-05-01.</span><br/>**Format:** yyyy-MM-dd (<a
                href='https://en.wikipedia.org/wiki/ISO_8601'
                target='_blank'>ISO 8601</a>)
            fromDateTime:
              type: string
              format: date-time
              description: >-
                Limits the report to insurance policy applications created on or
                after the specified date and time (by default, the current date
                and time).<br/>**Format:** yyyy-MM-dd'T'HH:mm:ssZ (<a
                href='https://en.wikipedia.org/wiki/ISO_8601'
                target='_blank'>ISO 8601</a>)
            toDateTime:
              type: string
              format: date-time
              description: >-
                Limits the report to insurance policy applications created on or
                before the specified date and time (by default, the current date
                and time).<br/>**Format:** yyyy-MM-dd'T'HH:mm:ssZ (<a
                href='https://en.wikipedia.org/wiki/ISO_8601'
                target='_blank'>ISO 8601</a>)
            insuranceLine:
              $ref: >-
                #/components/schemas/CreatePolicyApplicationsReportRequestInsuranceLine_V1
            vendors:
              type: array
              description: >-
                Limits the report to insurance policy applications submitted to
                the specified insurance vendors.<br/>**See:** [List insurance
                vendors](#get-/insurance-vendors) to determine the identifiers
                of the insurance vendors.
              items:
                $ref: >-
                  #/components/schemas/CreatePolicyApplicationsReportRequestInsuranceVendor
                description: 't:CreatePolicyApplicationsReportRequest.vendors.description'
            includeDescendants:
              type: boolean
              description: >-
                Whether to include insurance policy applications of child
                organizations (by default, false).
            includePendingApproval:
              type: boolean
              description: >-
                Whether to include insurance policy applications pending of
                approval (by default, false).
      required:
        - type
      title: PolicyApplications
    CreateReportRequest_V1:
      type: object
      discriminator:
        propertyName: type
      properties:
        type:
          type: string
          description: The type of report to create.
          enum:
            - PolicyApplications
  securitySchemes:
    OIDC:
      type: oauth2
      x-receive-token-in: request-body
      x-pkce-only: true
      description:
        $ref: /refs/oauth2-client-credentials.md#/description
      flows:
        clientCredentials:
          tokenUrl: 'https://api-int.codeoscopic.io/oauth2/token'
    clientApp:
      type: apiKey
      in: header
      name: X-Client-App
      description: >
        The client application from where the access to this API is
        originated.</br> **See:** [Request Headers](#overview--request-headers)
        <div/>

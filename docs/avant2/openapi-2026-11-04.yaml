                name: Office1
      x-badges:
        - label: TBM
          color: orange
    put:
      tags:
        - Brokerage
      summary: Update an office
      description: Updates an existing office.
      operationId: office.update
      parameters:
        - name: X-User-Email
          in: header
          description: The email of the user to execute the request in behalf of.
          required: true
          schema:
            type: string
        - name: officeId
          in: path
          description: The identifier of the office to update.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/vnd.codeoscopic.v1+json:
            schema:
              $ref: '#/components/schemas/OfficeWithoutId_V1'
            example:
              name: Office1
        required: true
      responses:
        '204':
          content:
            application/vnd.codeoscopic.v1+json: {}
      x-badges:
        - label: TBM
          color: orange
    delete:
      tags:
        - Brokerage
      summary: Delete an office
      description: Deletes an existing office.
      operationId: office.delete
      parameters:
        - name: X-User-Email
          in: header
          description: The email of the user to execute the request in behalf of.
          required: true
          schema:
            type: string
        - name: officeId
          in: path
          description: The identifier of the office to delete.
          required: true
          schema:
            type: string
      responses:
        '204':
          content:
            application/vnd.codeoscopic.v1+json: {}
      x-badges:
        - label: TBM
          color: orange
  /administrative-managers:
    get:
      tags:
        - Brokerage
      summary: Search for administrative managers
      description: Searches for administrative managers based on a search criteria.
      operationId: administrativeManager.search
      parameters:
        - name: X-User-Email
          in: header
          description: The email of the user to execute the request in behalf of.
          required: true
          schema:
            type: string
        - name: pageNumber
          in: query
          description: >-
            The page number indicating which set of items will be returned in
            the response. For example, the combination of `pageNumber=1` and
            `pageSize=20` returns the first 20 items, or the combination of
            `pageNumber=3` and `pageSize=20` returns items 41 through 60.
          schema:
            type: integer
            format: int64
            default: 1
            minimum: 1
        - name: pageSize
          in: query
          description: The number of items to return in the response.
          schema:
            type: integer
            format: int64
            default: 10
            maximum: 100
            minimum: 1
        - name: identificationDocumentId
          in: query
          description: >-
            Limits the response to administrative managers whose identification
            document number matches the specified one.
          schema:
            type: string
        - name: officeId
          in: query
          description: >-
            Limits the response to administrative managers whose office is the
            specified one.
          schema:
            type: string
      responses:
        '200':
          content:
            application/vnd.codeoscopic.v1+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ManagerImplementation_V1'
              examples:

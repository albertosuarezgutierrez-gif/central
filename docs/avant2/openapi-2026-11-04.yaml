paths:
  '{url}':
    get:
      tags:
        - File
      summary: Download a file (API Portal only)
      description: >-
        Operation, **exclusive to this API portal**, to try the downloading of a
        file: offers report, issued policy application document, etc.<br/><br/>
        **Note:** This operation is only meant for trying the download of files
        within this API portal. To perform the download in code, you should
        execute a regular `GET` request to the URL of the file with the
        `Authorization` header and, optionally, the `X-User-Email`
        header.<br/><br/> **Note:** Some files can only be downloaded once, such
        as: offers report.
      operationId: test.get
      parameters:
        - name: url
          in: path
          description: The **absolute** URL of the file you want to download.
          required: true
          schema:
            type: string
        - name: X-User-Email
          in: header
          description: The email of the user to execute the request in behalf of.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The binary content of the file.
          content:
            '*/*':
              schema:
                type: string
                format: binary
  /product-form-requests:
    post:
      tags:
        - Product Form
      summary: Execute a product form request
      description: >-
        Executes a request originated in the `Product Form`.


        **See:** [Product Form Library](#overview--product-form-library) to
        understand how to use this operation in your code.
      operationId: productForm.productFormRequests
      parameters:
        - name: X-User-Email
          in: header
          description: The email of the user to execute the request in behalf of.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/vnd.codeoscopic.v1+json:
            schema:
              $ref: '#/components/schemas/ProductFormRequest_V1'
            example:
              method: GET
              path: /places/provinces
        required: true
      responses:
        '200':
          description: ' '
          content:
            application/vnd.codeoscopic.v1+json:
              schema:
                type: object
                example:
                  id: Dni
                  name: DNI
                  description: Documento Nacional de Identidad
  /app-auth-tokens:
    post:
      tags:
        - ASM app
      summary: Create an authorization token for the app
      description: >
        Creates a single-use token that can be used to access <a
        href="https://avant2.es" target="_blank">

        ASM</a> as a specific user.


        When the URL returned in `appUrls` is opened, its `token` is consumed
        and the user is automatically

        logged in with the `userEmail` specified in the request body.


        <h3>Use with other app URLs</h3>


        Tokens generated with this method can be added as an `auth` query
        parameter to any of the `appUrls`

        returned by other API methods to allow users to navigate directly to the
        app without having to go

        through the login page.


        **For example:** If the [Search for insurance
        projects](#get-/insurances) returns this URL in

        `appUrls`:


        ```JSON

        {
          "rel": "Self",
          "url": "https://app.avant2.es/production/136784"
        }

        ```


        You can add the `auth` query parameter to allow direct browsing like
        this:


        `https://app.avant2.es/production/136784?auth=20pFafGgRb23zmH_qPtSNQra_CzEa9SiebexhcOmasMw`
      operationId: authTokens.createAppAuthToken
      requestBody:
        content:
          application/vnd.codeoscopic.v1+json:
            schema:
              $ref: '#/components/schemas/CreateAppAuthTokenRequest_V1'
        required: true
      responses:
        '200':
          content:
            application/vnd.codeoscopic.v1+json:
              schema:
                $ref: '#/components/schemas/AppAuthToken_V1'
        '400':
          description: Validation error
          content:
            application/vnd.codeoscopic.v1+json:
              schema:
                $ref: '#/components/schemas/Error_V1'
  /offices:
    get:
      tags:
        - Brokerage
      summary: List offices
      description: Lists all the offices.
      operationId: office.getAll
      parameters:
        - name: X-User-Email
          in: header
          description: The email of the user to execute the request in behalf of.
          required: true
          schema:
            type: string
      responses:
        '200':

  /home/recommend-limits:
    post:
      tags:
        - Home insurance line
      summary: Obtain recommended limits
      description: >-
        Recommends appropriate insurance limits for the specified home
        insurance.


        This method queries each of the available insurance vendors for
        recommended limits and returns the

        rounded average, highest and lowest limits.


        Additionally, it can also return the specific limits recommended by each
        insurance vendor by sending the

        `includeIndividualResults` parameter as `true`.


        **Note:** This operation can take more than a minute to complete
        depending on the timeout configured

        in the organization.
      operationId: home.recommendLimits
      parameters:
        - name: X-User-Email
          in: header
          description: The email of the user to execute the request in behalf of.
          schema:
            type: string
        - name: includeIndividualResults
          in: query
          description: Whether to include the recommended limits of each insurance vendor.
          schema:
            type: boolean
            default: false
            enum:
              - true
              - false
      requestBody:
        description: >-
          Many fields need values that have to be figured out using other API
          operations. Be sure

          to check the description of each field to know the allowed values and
          where to get them.
        content:
          application/vnd.codeoscopic.v1+json:
            schema:
              $ref: '#/components/schemas/HomeRecommendLimitsRequest_V1'
            examples:
              Recommend limits request:
                description: Recommend limits request
                $ref: >-
                  https://api-int.codeoscopic.io/doc/examples/home/recommend-limits-request.json
        required: true
      responses:
        '200':
          content:
            application/vnd.codeoscopic.v1+json:
              schema:
                $ref: '#/components/schemas/HomeRecommendedLimits_V1'
              examples:
                Recommend limits response:
                  description: Recommend limits response
                  $ref: >-

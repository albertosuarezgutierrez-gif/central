              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Office_V1'
              example:
                - id: '10'
                  name: Office1
      x-badges:
        - label: TBM
          color: orange
    post:
      tags:
        - Brokerage
      summary: Create an office
      description: Creates a new office.
      operationId: office.create
      parameters:
        - name: X-User-Email
          in: header
          description: The email of the user to execute the request in behalf of.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/vnd.codeoscopic.v1+json:
            schema:
              $ref: '#/components/schemas/OfficeWithoutId_V1'
            example:
              name: Office1
        required: true
      responses:
        '201':
          headers:
            Location:
              description: The URL of the new resource.
              style: simple
          content:
            application/vnd.codeoscopic.v1+json:
              schema:
                $ref: '#/components/schemas/IdObject_V1'
      x-badges:
        - label: TBM
          color: orange

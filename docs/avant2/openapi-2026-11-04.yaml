            - $ref: '#/components/schemas/TermLifeRisk_V1'
            - $ref: '#/components/schemas/HealthRisk_V1'
            - $ref: '#/components/schemas/BurialRisk_V1'
        appUrls:
          type: array
          description: >-
            A list of app URLs that link to related resources.<br/>**See:**
            [Create an authorization token for the app](#post-/app-auth-tokens)
            to add an `auth` query parameter to the URLs.<br/>**Returned:** if
            the integration with ASM is enabled.
          items:
            $ref: '#/components/schemas/AppUrl_V1'
          readOnly: true
        errors:
          type: array
          description: >-
            A list of the errors raised during the execution of processes
            related to this insurance project.
          items:
            $ref: '#/components/schemas/InsuranceProcessErrorObjectObject_V1'

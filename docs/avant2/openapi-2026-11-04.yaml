        '400':
          description: Validation error
          content:
            application/vnd.codeoscopic.v1+json:
              schema:
                $ref: '#/components/schemas/Error_V1'
    post:
      tags:
        - Insurance
      summary: Quote an insurance project
      description: >
        Creates a new insurance project and obtains quotes from each insurance
        vendor.


        **Note:** This operation can take more than a minute to complete
        depending on the timeout configured

        in the organization. Review the [Request
        Timeouts](#overview--request-timeouts) section if the

        operation ends unexpectedly.


        The quotes obtained will be found in the `mainQuotes` and `addonQuotes`
        fields depending on

        whether it's a main product or an add-on. Look at the `errors` field for
        failed quotes.


        Additionally, you will get a list of pre-configured `offers` that
        represent a combination of a main

        product quote and, optionally, some compatible add-on quotes.


        When necessary, you will receive further information about the state in
        the `messages` field of each

        result.
      operationId: insurance.quote
      parameters:
        - name: X-User-Email
          in: header
          description: The email of the user to execute the request in behalf of.
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        description: >-
          Many fields need values that have to be figured out using other API
          operations. Be sure

          to check the description of each field to know the allowed values and
          where to get them.

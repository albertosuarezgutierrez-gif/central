<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" fill="none">
  <!-- Fish icon -->
  <g transform="translate(8, 12)">
    <!-- Body -->
    <ellipse cx="24" cy="24" rx="18" ry="12" fill="#0f766e"/>
    <!-- Tail -->
    <path d="M6 24 L0 14 L0 34 Z" fill="#0f766e"/>
    <!-- Eye -->
    <circle cx="34" cy="20" r="2.5" fill="white"/>
    <circle cx="34.8" cy="20" r="1.2" fill="#0a5954"/>
    <!-- Fin top -->
    <path d="M20 12 Q26 6 32 12" stroke="#0f766e" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Scales lines -->
    <path d="M18 18 Q22 15 26 18" stroke="white" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M14 22 Q18 19 22 22" stroke="white" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>
  <!-- Text -->
  <text x="64" y="28" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#0f766e" letter-spacing="0.5">Mariscos</text>
  <text x="64" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#134e4a" letter-spacing="1">González</text>
  <!-- Accent line -->
  <line x1="64" y1="57" x2="310" y2="57" stroke="#0d9488" stroke-width="1.5" opacity="0.3"/>
</svg>
